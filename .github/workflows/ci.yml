name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build Frontend (estático)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Frontend é 100% HTML+CSS+JS puro — o build apenas valida os arquivos
      # e gera o env-api.js. Não há dependências npm.
      - run: node build.mjs
      - name: Sanidade básica (arquivos essenciais presentes)
        run: |
          test -f docs/index.html
          test -f docs/js/app.js
          test -f docs/js/api.js
          test -f docs/js/env-api.js
          test -f docs/pages/dashboard.js
          echo "frontend ok"

  backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar e testar (MongoDB embarcado)
        working-directory: backend
        run: ./mvnw -B verify
